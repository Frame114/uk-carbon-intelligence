server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health-backend {
        proxy_pass http://backend:8000/health;
    }
    location = /ready {
        proxy_pass http://backend:8000/ready;
    }
    location = /docs { proxy_pass http://backend:8000/docs; }
    location = /redoc { proxy_pass http://backend:8000/redoc; }
    location = /openapi.json { proxy_pass http://backend:8000/openapi.json; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
