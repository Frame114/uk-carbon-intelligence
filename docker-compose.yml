services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbon_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-carbon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [carbon]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: ${APP_NAME:-UK Carbon Intelligence API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-carbon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-carbon_intelligence}
      NESO_API_BASE_URL: ${NESO_API_BASE_URL:-https://api.carbonintensity.org.uk}
      NESO_TIMEOUT_SECONDS: ${NESO_TIMEOUT_SECONDS:-12}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-1800}
      SCHEDULER_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
    networks: [carbon]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_NAME: ${APP_NAME:-UK Carbon Intelligence API}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-carbon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-carbon_intelligence}
      NESO_API_BASE_URL: ${NESO_API_BASE_URL:-https://api.carbonintensity.org.uk}
      NESO_TIMEOUT_SECONDS: ${NESO_TIMEOUT_SECONDS:-12}
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-1800}
      SCHEDULER_ENABLED: "false"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [carbon]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 5s
    restart: unless-stopped
    networks: [carbon]

volumes:
  postgres_data:

networks:
  carbon:
    driver: bridge
